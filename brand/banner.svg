<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bannerBg" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Stage Glow -->
    <radialGradient id="stageGlow" cx="800" cy="315" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ff007f" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#ffaa00" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cyanMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Bloom Filter -->
    <filter id="bloomBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bannerBg)" />

  <!-- Subtle Perspective Grid (Floor) -->
  <g opacity="0.12" stroke="#00f2fe" stroke-width="1">
    <line x1="500" y1="480" x2="1150" y2="480" />
    <line x1="540" y1="520" x2="1110" y2="520" />
    <line x1="580" y1="560" x2="1070" y2="560" />
    <line x1="620" y1="600" x2="1030" y2="600" />
    <!-- Radiating Lines -->
    <line x1="825" y1="360" x2="520" y2="620" />
    <line x1="825" y1="360" x2="680" y2="620" />
    <line x1="825" y1="360" x2="825" y2="620" />
    <line x1="825" y1="360" x2="970" y2="620" />
    <line x1="825" y1="360" x2="1130" y2="620" />
  </g>

  <!-- Ambient Soundstage Glow -->
  <circle cx="825" cy="315" r="320" fill="url(#stageGlow)" />

  <!-- ========================================================================= -->
  <!-- LEFT PANEL: Brand Typography, Tagline, & Architecture Badges              -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 110)">
    <!-- Small Category Label -->
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00f2fe" letter-spacing="4">
      DOLBY-GRADE DSP • 48kHz BINAURAL
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="68" letter-spacing="-1">
      <tspan fill="#ffffff">Aura</tspan>
      <tspan fill="url(#cyanMagenta)">Stream</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="145" font-family="'Outfit', -apple-system, sans-serif" font-weight="400" font-size="24" fill="#cbd5e1" letter-spacing="0.2">
      Real-Time 3D Spatial Audio Workstation
    </text>

    <text x="0" y="185" font-family="'Outfit', -apple-system, sans-serif" font-weight="300" font-size="17" fill="#94a3b8" letter-spacing="0.2">
      Zero-allocation C++ WebAssembly DSP, Demucs 4-stem extraction,
    </text>
    <text x="0" y="212" font-family="'Outfit', -apple-system, sans-serif" font-weight="300" font-size="17" fill="#94a3b8" letter-spacing="0.2">
      interactive soundstage canvas, and sub-50ms distributed sync.
    </text>

    <!-- Architecture Badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1: C++ Wasm -->
      <rect x="0" y="0" width="138" height="34" rx="8" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1.2" />
      <text x="69" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="1">
        C++17 WASM
      </text>

      <!-- Badge 2: AI Stems -->
      <rect x="150" y="0" width="155" height="34" rx="8" fill="rgba(255, 0, 127, 0.1)" stroke="#ff007f" stroke-width="1.2" />
      <text x="227" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff007f" text-anchor="middle" letter-spacing="1">
        DEMUCS 4-STEM
      </text>

      <!-- Badge 3: -14 LUFS -->
      <rect x="317" y="0" width="138" height="34" rx="8" fill="rgba(255, 170, 0, 0.1)" stroke="#ffaa00" stroke-width="1.2" />
      <text x="386" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffaa00" text-anchor="middle" letter-spacing="1">
        -14 LUFS HUD
      </text>

      <!-- Badge 4: NTP Sync -->
      <rect x="0" y="46" width="180" height="34" rx="8" fill="rgba(0, 255, 136, 0.1)" stroke="#00ff88" stroke-width="1.2" />
      <text x="90" y="68" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1">
        &lt;50ms NTP SYNC
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PANEL: 3D Spatial Soundstage Radar & Orbital Stem Nodes             -->
  <!-- ========================================================================= -->
  <g transform="translate(825, 315)">
    <!-- Stage Bounding Rings -->
    <ellipse cx="0" cy="0" rx="260" ry="170" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" />
    <ellipse cx="0" cy="0" rx="190" ry="125" fill="none" stroke="#ffaa00" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="120" ry="80" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.5" />

    <!-- Spatial Axes -->
    <line x1="-270" y1="0" x2="270" y2="0" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="0" y1="-180" x2="0" y2="180" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Central Listener Avatar (0, 0, 0) -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" filter="url(#bloomBanner)" />
    <circle cx="0" cy="0" r="8" fill="#00f2fe" />
    <polygon points="0,-26 -7,-12 7,-12" fill="#00f2fe" /> <!-- Listener orientation cone -->
    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
      LISTENER (0,0,0)
    </text>

    <!-- Stem Node 1: Vocals (Magenta, Front) -->
    <line x1="0" y1="-110" x2="0" y2="-135" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="0" cy="-135" r="28" fill="none" stroke="#ff007f" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="0" cy="-135" r="14" fill="#ff007f" filter="url(#bloomBanner)" />
    <circle cx="0" cy="-135" r="6" fill="#ffffff" />
    <text x="0" y="-155" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff007f" text-anchor="middle">
      VOCALS [+0.2m]
    </text>

    <!-- Stem Node 2: Drums (Cyan, Left) -->
    <line x1="-160" y1="20" x2="-160" y2="0" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="-160" cy="0" r="28" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="-160" cy="0" r="14" fill="#00f2fe" filter="url(#bloomBanner)" />
    <circle cx="-160" cy="0" r="6" fill="#ffffff" />
    <text x="-160" y="-20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">
      DRUMS [-1.2m]
    </text>

    <!-- Stem Node 3: Other / Synths (Emerald, Right) -->
    <line x1="170" y1="-30" x2="170" y2="-10" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="170" cy="-10" r="28" fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="170" cy="-10" r="14" fill="#00ff88" filter="url(#bloomBanner)" />
    <circle cx="170" cy="-10" r="6" fill="#ffffff" />
    <text x="170" y="-30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00ff88" text-anchor="middle">
      OTHER [+1.2m]
    </text>

    <!-- Stem Node 4: Bass (Gold, Rear) -->
    <line x1="30" y1="80" x2="30" y2="105" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="30" cy="105" r="28" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="30" cy="105" r="14" fill="#ffaa00" filter="url(#bloomBanner)" />
    <circle cx="30" cy="105" r="6" fill="#ffffff" />
    <text x="30" y="135" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffaa00" text-anchor="middle">
      BASS [-0.4m]
    </text>
  </g>
</svg>
