<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="AuraStream">
  <title>AuraStream</title>
  <defs><clipPath id="stm"><circle cx="32" cy="32" r="27.01"/></clipPath></defs>
  <circle cx="32" cy="32" r="27.01" stroke="#2A3441" stroke-width="1.00" fill="none"/>
  <g stroke="#2A3441" stroke-width="1.00" stroke-linecap="round">
    <path d="M 32 4.99 v 4.40"/><path d="M 32 59.01 v -4.40"/>
    <path d="M 4.99 32 h 4.40"/><path d="M 59.01 32 h -4.40"/>
  </g>

  <!-- Spherical wavefronts, cropped by the stage boundary.
       The brightest one is passing through the listener: that is the arrival. -->
  <g clip-path="url(#stm)" fill="none" stroke="#8FE6FF" stroke-linecap="round">
    <path d="M 50.62 -31.02 a 47.40 47.40 0 1 0 0.01 0" stroke-width="1.30" opacity="0.14"/>
    <path d="M 50.62 -18.14 a 34.52 34.52 0 1 0 0.01 0" stroke-width="1.90" opacity="0.34"/>
    <path d="M 50.62 -7.93 a 24.31 24.31 0 1 0 0.01 0" stroke-width="2.80" opacity="1.0"/>
  </g>

  <!-- Source: white core, because it is the thing emitting -->
  <circle cx="50.62" cy="16.38" r="5.40" fill="#8FE6FF" opacity="0.16"/>
  <circle cx="50.62" cy="16.38" r="3.00" fill="#FFFFFF"/>

  <!-- Listener: open, because it receives -->
  <circle cx="32" cy="32" r="5.00" fill="#06080B"/>
  <circle cx="32" cy="32" r="5.00" stroke="#E8F3FF" stroke-width="1.90" fill="none"/>
</svg>
