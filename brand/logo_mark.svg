<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Core Gradients -->
    <linearGradient id="cyanMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="goldMagentaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="cyanEmeraldGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Filter for Luminous Bloom -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#auraGlow)" />

  <!-- Spatial Soundstage Orbital Rings (Concentric Binaural Waves) -->
  <!-- Outer Ring (Gold / Emerald) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#ffaa00" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4" />
  <circle cx="50" cy="50" r="34" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="14 6" opacity="0.6" />

  <!-- Binaural Sound Waves (Left & Right Ear Waves) -->
  <!-- Left Ear Waveforms -->
  <path d="M 28 35 A 26 26 0 0 0 28 65" fill="none" stroke="url(#cyanMagentaGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonBloom)" />
  <path d="M 20 28 A 38 38 0 0 0 20 72" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M 13 22 A 48 48 0 0 0 13 78" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 4" />

  <!-- Right Ear Waveforms -->
  <path d="M 72 35 A 26 26 0 0 1 72 65" fill="none" stroke="url(#cyanMagentaGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonBloom)" />
  <path d="M 80 28 A 38 38 0 0 1 80 72" fill="none" stroke="#ff007f" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
  <path d="M 87 22 A 48 48 0 0 1 87 78" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 4" />

  <!-- Central Dynamic "A" Spatial Beam -->
  <path d="M 50 16 L 36 68 L 44 68 L 47 56 L 53 56 L 56 68 L 64 68 Z" fill="none" stroke="url(#cyanMagentaGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#neonBloom)" />
  <!-- A crossbar sound pulse -->
  <line x1="43" y1="56" x2="57" y2="56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- 3D Spatial Listener Focal Core (Center) -->
  <circle cx="50" cy="46" r="4.5" fill="#ffffff" filter="url(#neonBloom)" />
  <circle cx="50" cy="46" r="2" fill="#00f2fe" />

  <!-- 4 Spatial Stem Orbital Markers (Vocals, Drums, Bass, Other) -->
  <!-- Vocals (Top Magenta) -->
  <circle cx="50" cy="16" r="3" fill="#ff007f" filter="url(#neonBloom)" />
  <!-- Drums (Left Cyan) -->
  <circle cx="20" cy="50" r="3" fill="#00f2fe" filter="url(#neonBloom)" />
  <!-- Other (Right Emerald) -->
  <circle cx="80" cy="50" r="3" fill="#00ff88" filter="url(#neonBloom)" />
  <!-- Bass (Bottom Gold) -->
  <circle cx="50" cy="84" r="3" fill="#ffaa00" filter="url(#neonBloom)" />
</svg>
