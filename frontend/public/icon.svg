<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Icon Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116" />
    </clipPath>

    <!-- Deep Background Gradient -->
    <radialGradient id="bgObsidian" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#141c30" />
      <stop offset="60%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Ambient Aura Glow -->
    <radialGradient id="appAuraGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#ff007f" stop-opacity="0.22" />
      <stop offset="80%" stop-color="#ffaa00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gradients -->
    <linearGradient id="neonCyanMagenta" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="rimSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Bloom Filter -->
    <filter id="bloomIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#bgObsidian)" />

    <!-- Ambient Soundstage Glow -->
    <circle cx="256" cy="256" r="240" fill="url(#appAuraGlow)" />

    <!-- Soundstage Coordinate Grid Lines (Subtle) -->
    <circle cx="256" cy="256" r="185" fill="none" stroke="#ffaa00" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.35" />
    <circle cx="256" cy="256" r="145" fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="16 8" opacity="0.45" />
    <circle cx="256" cy="256" r="105" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" />

    <!-- Coordinate Crosshairs -->
    <line x1="256" y1="56" x2="256" y2="456" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="56" y1="256" x2="456" y2="256" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Binaural Sound Wave Shells (Left Ear) -->
    <path d="M 148 185 A 130 130 0 0 0 148 327" fill="none" stroke="url(#neonCyanMagenta)" stroke-width="14" stroke-linecap="round" filter="url(#bloomIcon)" />
    <path d="M 110 152 A 185 185 0 0 0 110 360" fill="none" stroke="#00f2fe" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <path d="M 75 125 A 240 240 0 0 0 75 387" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" opacity="0.45" stroke-dasharray="10 10" />

    <!-- Binaural Sound Wave Shells (Right Ear) -->
    <path d="M 364 185 A 130 130 0 0 1 364 327" fill="none" stroke="url(#neonCyanMagenta)" stroke-width="14" stroke-linecap="round" filter="url(#bloomIcon)" />
    <path d="M 402 152 A 185 185 0 0 1 402 360" fill="none" stroke="#ff007f" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <path d="M 437 125 A 240 240 0 0 1 437 387" fill="none" stroke="#ff007f" stroke-width="5" stroke-linecap="round" opacity="0.45" stroke-dasharray="10 10" />

    <!-- Central Geometric "A" Beam -->
    <path d="M 256 96 L 192 344 L 226 344 L 242 284 L 270 284 L 286 344 L 320 344 Z" fill="none" stroke="url(#neonCyanMagenta)" stroke-width="12" stroke-linejoin="round" filter="url(#bloomIcon)" />
    <line x1="225" y1="284" x2="287" y2="284" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Central Listener Core (0, 0, 0) -->
    <circle cx="256" cy="235" r="22" fill="#ffffff" filter="url(#bloomIcon)" />
    <circle cx="256" cy="235" r="11" fill="#00f2fe" />
    <polygon points="256,198 250,212 262,212" fill="#00f2fe" /> <!-- Listener forward cone -->

    <!-- Four Spatial Stem Orbital Orbs -->
    <!-- Lead Vocals (Top Magenta) -->
    <circle cx="256" cy="96" r="14" fill="#ff007f" filter="url(#bloomIcon)" />
    <circle cx="256" cy="96" r="6" fill="#ffffff" />

    <!-- Drums & Percussion (Left Cyan) -->
    <circle cx="110" cy="256" r="14" fill="#00f2fe" filter="url(#bloomIcon)" />
    <circle cx="110" cy="256" r="6" fill="#ffffff" />

    <!-- Other / Synths (Right Emerald) -->
    <circle cx="402" cy="256" r="14" fill="#00ff88" filter="url(#bloomIcon)" />
    <circle cx="402" cy="256" r="6" fill="#ffffff" />

    <!-- Sub Bass (Bottom Gold) -->
    <circle cx="256" cy="416" r="14" fill="#ffaa00" filter="url(#bloomIcon)" />
    <circle cx="256" cy="416" r="6" fill="#ffffff" />

    <!-- Top Metallic Edge Sheen Highlight -->
    <rect width="512" height="512" fill="none" stroke="url(#rimSheen)" stroke-width="3" rx="116" ry="116" />
  </g>
</svg>
