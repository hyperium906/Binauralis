<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#bf55ec" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Filter for Luminous Bloom -->
    <filter id="bloomFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group: Logo Mark (Left, x=10 to x=90) -->
  <g transform="translate(8, 8) scale(0.84)">
    <!-- Spatial Rings -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="#ffaa00" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4" />
    <circle cx="50" cy="50" r="35" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="14 6" opacity="0.6" />

    <!-- Left & Right Binaural Waves -->
    <path d="M 28 35 A 26 26 0 0 0 28 65" fill="none" stroke="url(#markGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#bloomFull)" />
    <path d="M 20 28 A 38 38 0 0 0 20 72" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
    <path d="M 72 35 A 26 26 0 0 1 72 65" fill="none" stroke="url(#markGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#bloomFull)" />
    <path d="M 80 28 A 38 38 0 0 1 80 72" fill="none" stroke="#ff007f" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

    <!-- Stylized Geometric "A" -->
    <path d="M 50 16 L 36 68 L 44 68 L 47 56 L 53 56 L 56 68 L 64 68 Z" fill="none" stroke="url(#markGrad)" stroke-width="2.8" stroke-linejoin="round" filter="url(#bloomFull)" />
    <line x1="43" y1="56" x2="57" y2="56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Core Node & Stem Nodes -->
    <circle cx="50" cy="46" r="4" fill="#ffffff" filter="url(#bloomFull)" />
    <circle cx="50" cy="16" r="3" fill="#ff007f" />
    <circle cx="20" cy="50" r="3" fill="#00f2fe" />
    <circle cx="80" cy="50" r="3" fill="#00ff88" />
    <circle cx="50" cy="84" r="3" fill="#ffaa00" />
  </g>

  <!-- Group: Typography (x=112 onwards) -->
  <g transform="translate(110, 0)">
    <!-- Wordmark "AuraStream" -->
    <text x="0" y="58" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="44" letter-spacing="-0.5">
      <tspan fill="#ffffff">Aura</tspan>
      <tspan fill="url(#streamGrad)">Stream</tspan>
    </text>

    <!-- Subtitle: SPATIAL AUDIO WORKSTATION -->
    <text x="2" y="80" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="3.2">
      SPATIAL AUDIO ENGINE // 48kHz
    </text>

    <!-- Badge: REAL-TIME DSP -->
    <rect x="252" y="32" width="70" height="18" rx="4" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="0.8" />
    <text x="287" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="1">
      ZERO-ALLOC
    </text>
  </g>
</svg>
